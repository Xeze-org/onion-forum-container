<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or 'Onion Forum' }}</title>
    <meta name="description" content="Anonymous, lightweight forum on the Tor network. No tracking, no JavaScript." />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="/">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" class="icon"><path fill="currentColor" d="M12 2C9.2 2 7 4.2 7 7v2H6a4 4 0 0 0-4 4v5a2 2 0 0 0 2 2h6v-6H7v-3c0-2.8 2.2-5 5-5s5 2.2 5 5v3h-3v6h6a2 2 0 0 0 2-2v-5a4 4 0 0 0-4-4h-1V7c0-2.8-2.2-5-5-5Z"/></svg>
          Onion Forum
        </a>
        {% if is_admin %}
          <a href="/admin" class="nav-link nav-accent" style="font-weight: 700;">Admin Page</a>
        {% endif %}
        <div class="topbar-right">
          {% if current_user %}
            <span class="user-name">{{ current_user }}</span>
            <form method="post" action="/logout" style="display:inline;">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
              <button type="submit" class="logout-btn">Log Out</button>
            </form>
          {% else %}
            <a href="/login" class="nav-link">Log In</a>
            <a href="/login?mode=register" class="nav-link nav-accent">Register</a>
          {% endif %}
        </div>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <div class="container">
        <span class="footer-brand">🧅 Onion Forum</span>
        <small>Lightweight forum • No tracking • No JavaScript • Works over Tor</small>
      </div>
    </footer>
  </body>
  </html>
